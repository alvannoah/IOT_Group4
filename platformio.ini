; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    mandulaj/PZEM-004T-v30@^1.1.2

; Host-side unit tests that need no hardware: pio test -e native
[env:native]
platform = native
