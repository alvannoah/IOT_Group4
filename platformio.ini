; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    mandulaj/PZEM-004T-v30@^1.1.2

; Host-side unit tests that need no hardware: pio test -e native
[env:native]
platform = native

; Solenoid valve only, controlled from the serial monitor: pio run -e valve_test -t upload
[env:valve_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../examples/valve_test/valve_test.cpp>

; Water pump only, controlled from the serial monitor: pio run -e pump_test -t upload
[env:pump_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../examples/pump_test/pump_test.cpp>

; Valve (D7) and pump (D8) together, controlled from the serial monitor:
; pio run -e pump_valve_test -t upload
[env:pump_valve_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../examples/pump_valve_test/pump_valve_test.cpp>

; Water flow sensor only, prints readings to the serial monitor:
; pio run -e flow_test -t upload
[env:flow_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../examples/flow_test/flow_test.cpp>

; Valve (D7), pump (D8) and flow sensor (D2) together, via the serial monitor:
; pio run -e water_test -t upload
[env:water_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../examples/water_test/water_test.cpp>

; ESP-01 AT command pass-through to the serial monitor: pio run -e at_test -t upload
[env:at_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../examples/at_test/at_test.cpp>

; PZEM-004T only, prints readings to the serial monitor: pio run -e pzem_test -t upload
[env:pzem_test]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    mandulaj/PZEM-004T-v30@^1.1.2
build_src_filter = -<*> +<../examples/pzem_test/pzem_test.cpp>
